    # RaftChannel3S2: 2o grupo Raft nativo independente (shard 2) pras baterias
    # de 2 shards — mesmas identidades TLS de RaftChannel3, portas +1
    # (7051/8051/9051) pra rodar lado a lado no mesmo host.
    RaftChannel3S2:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            OrdererType: etcdraft
            Organizations:
                - *OrdererOrg
            Capabilities:
