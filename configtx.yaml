    # ==========================================
    # PERFIS SKEEN-CFT-REAL: OrdererType skeen (consenter Skeen faz só a
    # coordenação cross-shard), mas com um bloco EtcdRaft real no config do
    # canal, para que o consenter skeen delegue a replicação intra-shard ao
    # motor etcdraft nativo do Fabric (ver encoder.go case "skeen" e
    # skeen.chain innerChain). Um perfil por shard (3 réplicas cada, mesma
    # convenção do resto do projeto — CFT tolera 1 crash em 3 nós), portas
    # próprias por shard. Reaproveita as identidades TLS já existentes
    # (orderer/orderer2/orderer3).
    # ==========================================
    SkeenCFTRealGenesis1:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
            EtcdRaft:
                Consenters:
                    - Host: 127.0.0.1
                      Port: 7050
                      ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                      ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                    - Host: 127.0.0.1
                      Port: 7051
                      ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                      ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                    - Host: 127.0.0.1
                      Port: 7052
                      ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
                      ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
            Capabilities:
                <<: *ApplicationCapabilities

