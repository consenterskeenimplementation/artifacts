Organizations:
    - &OrdererOrg
        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: crypto-config/ordererOrganizations/example.com/msp

        OrdererEndpoints:
            - 127.0.0.1:7050
            - 127.0.0.1:8050
            - 127.0.0.1:9050
            - 127.0.0.1:10050

        Policies:
            Readers: {Type: Signature, Rule: "OR('OrdererMSP.member')"}
            Writers: {Type: Signature, Rule: "OR('OrdererMSP.member')"}
            Admins:  {Type: Signature, Rule: "OR('OrdererMSP.admin')"}

    - &Org1
        Name: Org1MSP
        ID: Org1MSP
        MSPDir: crypto-config/peerOrganizations/org1.example.com/msp
        Policies:
            Readers: {Type: Signature, Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"}
            Writers: {Type: Signature, Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"}
            Admins:  {Type: Signature, Rule: "OR('Org1MSP.admin')"}
            Endorsement: {Type: Signature, Rule: "OR('Org1MSP.peer')"}

Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Channel_V3: &ChannelCapabilities_V3
        V3_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Orderer_V3: &OrdererCapabilities_V3
        V3_0: true
    Application: &ApplicationCapabilities
        V2_0: true

Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers: {Type: ImplicitMeta, Rule: "ANY Readers"}
        Writers: {Type: ImplicitMeta, Rule: "ANY Writers"}
        Admins:  {Type: ImplicitMeta, Rule: "MAJORITY Admins"}
        LifecycleEndorsement: {Type: ImplicitMeta, Rule: "MAJORITY Endorsement"}
        Endorsement: {Type: ImplicitMeta, Rule: "MAJORITY Endorsement"}

Orderer: &OrdererDefaults
    OrdererType: skeen
    Addresses:
        - 127.0.0.1:7050
        - 127.0.0.1:8050
        - 127.0.0.1:9050
        - 127.0.0.1:10050
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 500
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers: {Type: ImplicitMeta, Rule: "ANY Readers"}
        Writers: {Type: ImplicitMeta, Rule: "ANY Writers"}
        Admins:  {Type: ImplicitMeta, Rule: "MAJORITY Admins"}
        BlockValidation: {Type: ImplicitMeta, Rule: "ANY Writers"}

Channel: &ChannelDefaults
    Policies:
        Readers: {Type: ImplicitMeta, Rule: "ANY Readers"}
        # Era ImplicitMeta "ANY Writers". O Fabric monta as sub-políticas (Application/Writers, Orderer/Writers)
        # iterando um mapa Go — ordem aleatória por processo — e cada uma verifica a assinatura ECDSA antes de
        # checar a organização: em parte dos boots a tx do cliente Org1 era verificada 2× (≈2/3 da vazão, zig-zag).
        # Uma única política de assinatura com os mesmos escritores verifica 1× sempre (diagnóstico de 01/10/2026).
        Writers: {Type: Signature, Rule: "OR('Org1MSP.admin', 'Org1MSP.client', 'OrdererMSP.member')"}
        Admins:  {Type: ImplicitMeta, Rule: "MAJORITY Admins"}

Profiles:
    SkeenGenesis:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
            Capabilities:
                <<: *ApplicationCapabilities

    # SkeenGenesisRTT: igual a SkeenGenesis, mas MaxMessageCount=1 — cada
    # transação corta seu próprio bloco IMEDIATAMENTE por contagem, sem
    # esperar o BatchTimeout de 2s. Só pra testes de baixa concorrência
    # (workers=1) que medem latência de commit real via Deliver — com o
    # BatchSize padrão (500), transações isoladas nunca enchem o lote por
    # contagem e a latência medida fica dominada pelo timer de 2s, mascarando
    # o efeito real que queremos medir (RTT de replicação). Ver
    SkeenGenesisRTT:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            BatchSize:
                MaxMessageCount: 1
                AbsoluteMaxBytes: 99 MB
                PreferredMaxBytes: 512 KB
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
            Capabilities:
                <<: *ApplicationCapabilities

    SkeenChannel:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
            Capabilities:
                <<: *ApplicationCapabilities

    # ==========================================
    # PERFIS SKEEN-BFT-REAL: OrdererType skeen (consenter Skeen faz só a
    # coordenação cross-shard), mas com ConsenterMapping + SmartBFT Options
    # reais no config do canal, para que o consenter skeen delegue a
    # replicação intra-shard ao motor SmartBFT nativo do Fabric (ver
    # encoder.go case "skeen" e skeen.chain innerChain). Um perfil por shard
    # porque cada shard tem 4 réplicas em portas próprias; reaproveita as
    # mesmas 4 identidades TLS (orderer/orderer2/orderer3/orderer4) já
    # geradas por crypto-config.yaml — só o Host:Port muda por shard.
    # ==========================================
    SkeenBFTRealGenesis1: &SkeenBFTRealBase
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities_V3
        Orderer:
            <<: *OrdererDefaults
            Addresses: []
            BatchSize:
                MaxMessageCount: 5000
                AbsoluteMaxBytes: 10 MB
                PreferredMaxBytes: 512 KB
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
            ConsenterMapping:
                - ID: 1
                  Host: 127.0.0.1
                  Port: 7050
                  MSPID: OrdererMSP
                  Identity: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp/signcerts/orderer.example.com-cert.pem
                  ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                  ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                - ID: 2
                  Host: 127.0.0.1
                  Port: 7051
                  MSPID: OrdererMSP
                  Identity: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/msp/signcerts/orderer2.example.com-cert.pem
                  ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                  ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                - ID: 3
                  Host: 127.0.0.1
                  Port: 7052
                  MSPID: OrdererMSP
                  Identity: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/msp/signcerts/orderer3.example.com-cert.pem
                  ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
                  ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
                - ID: 4
                  Host: 127.0.0.1
                  Port: 7053
                  MSPID: OrdererMSP
                  Identity: crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/msp/signcerts/orderer4.example.com-cert.pem
                  ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
                  ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
            SmartBFT: &SkeenBFTRealSmartBFTOptions
                RequestBatchMaxInterval: 200ms
                RequestForwardTimeout: 5s
                RequestComplainTimeout: 20s
                RequestAutoRemoveTimeout: 3m0s
                ViewChangeResendInterval: 5s
                ViewChangeTimeout: 20s
                LeaderHeartbeatTimeout: 1m0s
                CollectTimeout: 1s
                IncomingMessageBufferSize: 200
                RequestPoolSize: 100000
                LeaderHeartbeatCount: 10
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
            Capabilities:
                <<: *ApplicationCapabilities

